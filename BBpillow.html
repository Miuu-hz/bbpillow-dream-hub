<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BBpillow — Quality sleep at flea-market prices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Mitr:wght@400;500;600&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --paper: #F7F5F0;
      --soil: #3E2A1E;
      --sky: #3A6EA5;
      --clay: #C06C53;
      --heading-font: "Prompt", sans-serif;
      --body-font: "Sarabun", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--soil);
      font-family: var(--body-font), system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3, h4, h5 { font-family: var(--heading-font), sans-serif; }
    button { font: inherit; }
    img { display: block; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(62,42,30,.15); border-radius: 4px; }
    [style*="overflow-x:auto"]::-webkit-scrollbar,
    [style*="overflow-x: auto"]::-webkit-scrollbar { display: none; }

    /* Responsive */
    @media (max-width: 860px) {
      .bb-hero-grid { grid-template-columns: 1fr !important; gap: 28px !important; }
      .bb-shop-grid { grid-template-columns: 1fr !important; }
      .bb-cart-grid { grid-template-columns: 1fr !important; }
      .bb-footer-grid { grid-template-columns: 1fr 1fr !important; gap: 22px !important; }
      .bb-filters { display: none; }
      .bb-dash-hero { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 720px) {
      .bb-nav { display: none !important; }
      .bb-mobile-menu { display: inline-flex !important; }
    }
    @media (max-width: 1080px) {
      .bb-mini-info { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data (plain JS) -->
  <script src="app/data.js"></script>

  <!-- iOS device frame -->
  <script type="text/babel" src="ios-frame.jsx"></script>

  <!-- Tweaks panel helpers -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- App scripts -->
  <script type="text/babel" src="app/ui.jsx"></script>
  <script type="text/babel" src="app/web.jsx"></script>
  <script type="text/babel" src="app/web2.jsx"></script>
  <script type="text/babel" src="app/miniapp.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
